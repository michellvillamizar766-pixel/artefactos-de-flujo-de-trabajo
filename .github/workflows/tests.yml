name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with Coverage
        run: |
          npm install
          npm run test:coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
        name: coverage-report
          path: coverage/




